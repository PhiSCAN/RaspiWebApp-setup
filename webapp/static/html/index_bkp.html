        <script type="text/babel">
            var globModalOpen = false;
            const { useState, useEffect } = React;

            const StatusEl = ({ state, text }) => {
                return (
                    <div>
                        <div
                            className={`dot0 ${
                                state == 0
                                    ? "dot-red"
                                    : state == 1
                                    ? "dot-green"
                                    : state == 2
                                    ? "dot-yellow"
                                    : ""
                            }`}
                        ></div>
                        <span>{text}</span>
                        <span
                            className={`${
                                state == 0
                                    ? "text-red"
                                    : state == 1
                                    ? "text-green"
                                    : state == 2
                                    ? "text-yellow"
                                    : ""
                            }`}
                        >
                            {" "}
                            {state == 0
                                ? "Error"
                                : state == 1
                                ? "Done"
                                : state == 2
                                ? "Progress..."
                                : "-"}{" "}
                        </span>
                    </div>
                );
            };

            function Dot({ state }) {
                return (
                    <div
                        className={`dot0 ${
                            state == 0
                                ? "dot-red"
                                : state == 1
                                ? "dot-green"
                                : ""
                        }`}
                    ></div>
                );
            }

            function useMediaQuery(query) {
                const [matches, setMatches] = useState(
                    () => window.matchMedia(query).matches
                );

                useEffect(() => {
                    const mediaQueryList = window.matchMedia(query);
                    const listener = (event) => setMatches(event.matches);

                    mediaQueryList.addEventListener("change", listener); // modern API
                    return () =>
                        mediaQueryList.removeEventListener("change", listener);
                }, [query]);

                return matches;
            }

            function ProgressBar({ value = 0, label = "0/0" }) {
                const clamped = Math.min(100, Math.max(0, value));

                return (
                    <div
                        className="progress-container"
                        style={{ position: "relative" }}
                    >
                        <div
                            className="progress-fill"
                            style={{ width: `${clamped}%` }}
                        />
                        <div className="progress-label">copying... {label}</div>
                    </div>
                );
            }

            function App() {

                const [udpStatus, setUdpStatus] = useState("Idle");

                const isMobile = useMediaQuery("(max-width: 768px)");

                        stopRec: -1,
                        startRec: -1,

                        lidarOff: -1,
                        gpsOn: -1,

                const resetStopButtonStatuses = () => {

                    listLocalRosbags();

                async function initializeLidar() {
                    resetAllButtonStatus();

                    setButtonStates((prevState) => {
                        return { ...prevState, dataSync: 2 };
                    });
                    const ptpdResponse = await fetch("/ptpd/on", {
                        method: "GET",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const ptpdResult = await ptpdResponse.json();
                    const rosResponse = await fetch("/roscore/on", {
                        method: "GET",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const rosResult = await rosResponse.json();
                    if (ptpdResult.success && rosResult.success) {
                        setButtonStates((prevState) => {
                            return { ...prevState, dataSync: 1 };
                        });
                    } else {
                        setButtonStates((prevState) => {
                            return { ...prevState, dataSync: 0 };
                        });
                        throw Error("datasync issue");
                    }

                    setButtonStates((prevState) => {
                        return { ...prevState, imuOn: 2, imu2On: 2 };
                    });
                    const imuResponse = await fetch("/imu/on", {
                        method: "GET",
                        headers: {

                    const imuResult = await imuResponse.json();
                    if (!imuResult.success) {
                        setButtonStates((prevState) => {
                            return { ...prevState, imuOn: 0, imu2On: 0 };
                        });
                    } else {
                        // setButtonStates((prevState) => { return { ...prevState, imuOn: 1 } })
                    }

                    setButtonStates((prevState) => {
                        return { ...prevState, lidarOn: 2 };
                    });
                    const lidarResponse = await fetch(`/lidar/on`, {
                        method: "GET",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const lidarResult = await lidarResponse.json();
                    if (!lidarResult.success) {
                        setButtonStates((prevState) => {
                            return { ...prevState, lidarOn: 0 };
                        });
                    } else {
                        // setStatuses(2, "done", lidarResult.msg);
                        // checkReadiness(3)
                    }

                    const statusResponse = await fetch("/topic-statuses", {
                        method: "GET",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const statusResult = await statusResponse.json();
                    if (statusResult.success) {
                        const statusData = statusResult.data;
                        setButtonStates((prevState) => {
                            return {
                                ...prevState,
                                imuOn: statusData[0] ? 1 : 0,
                                imu2On: statusData[1] ? 1 : 0,
                                lidarOn: statusData[2] ? 1 : 0,
                            };
                        });
                        setLidarInitialized(true);
                    } else {

                        alert("error");
                    }
                }

                            // checkReadiness(3)

                    } catch (err) {

                    setButtonStates((prevState) => {

                    });

                    );
                    const motorResult = await motorResponse.json();
                    if (!motorResult.success) {
                        setButtonStates((prevState) => {

                        });
                    } else {
                        setButtonStates((prevState) => {
                            return { ...prevState, motorOn: 1, motorOff: -1 };

                async function unmountPendrive() {
                    try {
                        if (
                            !confirm(
                                `ARE YOU SURE TO UNMOUNT ${selectedPd}????`
                            )
                        )
                            return;
                        setPdBagsList(["Unmounting...."]);
                        setShowOverlay(true);
                        setDialog("UNMOUNTING.......");
                        const controller = new AbortController();

                        const id = setTimeout(() => controller.abort(), 5000);

                        const rosbagResp = await fetch(
                            `/unmount-pd?pd=${selectedPd}`,
                            {
                                method: "GET",
                                signal: controller.signal,
                                headers: {
                                    "Content-Type": "application/json",
                                },
                            }
                        );
                        clearTimeout(id);

                        const rosbagResult = await rosbagResp.json();
                        if (!rosbagResult.success) {
                            alert(rosbagResult.data.script_output);
                        } else {
                            if (rosbagResult.data.success) {

                                setPendrives([]);
                                setTimeout(() => {

                                }, 100);
                            } else {

                                    listPendrives();
                                }, 100);
                            }
                        }
                        setShowOverlay(false);
                        setDialog("");

                                setShowOverlay(false);
                                setDialog("");
                            } else {
                                listPendrives();
                            }
                            numAttempts++;
                        }, 2000);
                    }
                }

                async function copyLocalData() {
                    if (
                        !confirm(
                            "ARE YOU SURE TO COPY ALL DATA TO PENDRIVE????"
                        )
                    )
                        return;
                    // setPendrives(["deleting...."]);
                    setShowOverlay(true);
                    setDialog("COPYING.......");
                    const counterId = setInterval(() => {
                        fetch(
                            `http://127.0.0.1:8000/file-count?pd=${selectedPd}`,
                            {
                                method: "GET",
                                headers: {
                                    "Content-Type": "application/json",
                                },
                            }
                        )
                            .then((res) => res.json())
                            .then((resData) => {
                                setCopiedFileCount(
                                    (resData.data.copiedCount /
                                        resData.data.localCount) *
                                        100
                                );
                                setCopiedData(resData.data);
                                if (

                                        resData.data.localCount ===

                                    clearInterval(counterId);

                            })
                            .catch((err) => {

                            });

                            setDialog();
                        }, 1000);
                    }
                    // setShowOverlay(false);
                    // setDialog();
                }

                        });
                    } else {
                        setButtonStates((prevState) => {
                            return { ...prevState, lidarOff: 1, lidarOn: -1 };
                        });
                    }

                    setButtonStates((prevState) => {
                        return { ...prevState, stopRec: 2, dataSync: -1 };
                    });
                    const rosResponse = await fetch("/roscore/off", {
                        method: "GET",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const rosResult = await rosResponse.json();

                    const recResponse = await fetch("/record/off", {
                        method: "GET",
                        headers: {
                            "Content-Type": "application/json",
                        },
                    });
                    const recResult = await recResponse.json();
                    if (!recResult.success) {
                        setButtonStates((prevState) => {
                            return { ...prevState, stopRec: 0 };
                        });
                    } else {
                        setButtonStates((prevState) => {
                            return { ...prevState, stopRec: 1, startRec: -1 };
                        });
                        setLidarInitialized(false);
                        setRecordingStarted(false);
                    }
                }

                async function startSendingTimestamps(fps) {
                    if (!udpStarted) {
                        setUdpStatus("Starting...");
                        try {
                            const resp = await fetch("/start-udp", {
                                method: "POST",
                                body: JSON.stringify({ fps }),
                                headers: { "Content-Type": "application/json" },
                            });
                            const result = await resp.json();
                            console.log(result);
                            setUdpStatus(result.msg);
                            setUdpStarted(true);
                        } catch (error) {
                            console.log(error.message);
                            setUdpStatus("Error");
                            setUdpStarted(false);
                        }
                    } else {
                        try {
                            setUdpStatus("Stopping...");
                            const resp = await fetch("/stop-udp", {
                                method: "GET",
                                headers: { "Content-Type": "application/json" },
                            });
                            const result = await resp.json();
                            console.log(result);
                            setUdpStatus("Idle");
                            setUdpStarted(false);
                        } catch (error) {
                            console.log(error.message);
                            setUdpStatus("Error");
                        }
                    }
                }

                return (
                    <div
                        className="row"
                        style={{
                            width: isMobile ? "auto" : "50rem",
                            marginTop: "20px",
                        }}
                    >
                        {showOverlay && (
                            <div className="overlay text-white">
                                {copiedFileCount !== null &&
                                dialog.toLowerCase().includes("copy") ? (
                                    <ProgressBar
                                        value={copiedFileCount}
                                        label={`${
                                            copiedData.copiedCount ?? 0
                                        }/${copiedData.localCount ?? 0}`}
                                    />
                                ) : (
                                    <h2>
                                        {dialog}
                                        {copiedFileCount !== null &&
                                            dialog
                                                .toLowerCase()
                                                .includes("copy") &&
                                            ` - ${copiedFileCount}`}
                                    </h2>
                                )}
                            </div>
                        )}

                        {/* Left Column */}
                        <div className="col-12 col-md-5 mb-4">
                            <div className="container">
                                {/* Motor Controls */}
                                <div>
                                    <input
                                        type="number"
                                        onChange={(e) => setFps(e.target.value)}
                                    />{" "}
                                    &nbsp;
                                    <button
                                        className={`btn ${
                                            udpStarted
                                                ? "btn-danger"
                                                : "btn-info"
                                        }`}
                                        style={{ marginTop: "5px" }}
                                        onClick={() => {
                                            startSendingTimestamps(fps);
                                        }}
                                    >
                                        {udpStarted ? "Stop UDP" : "Start UDP"}{" "}
                                        &nbsp;
                                        <span style={{ fontSize: "12px" }}>
                                            server state: ({udpStatus})
                                        </span>
                                    </button>
                                </div>
                                <div className="dots d-flex flex-wrap justify-content-center mb-3">
                                    <div className="d-flex flex-column align-items-center me-3 mb-2 dots">
                                        <StatusEl
                                            state={buttonStates["motorOn"]}
                                            text="Start Motor:"
                                        />
                                        <button
                                            className="btn btn-info"
                                            onClick={() => startMotor(10)}
                                            style={{ marginTop: "5px" }}
                                        >
                                            Start Motor (v=10)
                                        </button>
                                        <input
                                            type="number"
                                            class="form-control"
                                            placeholder="velocity"
                                            value={custVel}
                                            onChange={(e) =>
                                                setCustVel(e.target.value)
                                            }
                                        />
                                        <button
                                            className="btn btn-success"
                                            disabled={!custVel}
                                            onClick={() => startMotor(3)}
                                            style={{ marginTop: "5px" }}
                                        >
                                            Start Motor (v={custVel})
                                        </button>
                                    </div>
                                    <div className="d-flex flex-column align-items-center mb-2 dots">
                                        <StatusEl
                                            state={buttonStates["motorOff"]}
                                            text="Stop Motor:"
                                        />
                                        <button
                                            className="btn btn-danger"
                                            onClick={stopMotor}
                                            style={{ marginTop: "5px" }}
                                        >
                                            Stop Motor
                                        </button>
                                    </div>
                                </div>

                                {/* Status Dots */}
                                <div className="dots d-flex flex-wrap justify-content-around mb-3">
                                    <StatusEl
                                        state={buttonStates["gpsOn"]}
                                        text="GPS Status:"
                                    />
                                    <button
                                        class="btn btn-warning"
                                        onClick={startGPS}
                                    >
                                        Initalize GPS
                                    </button>
                                    <StatusEl
                                        state={buttonStates["dataSync"]}
                                        text="Data Syncing:"
                                    />
                                    <StatusEl
                                        state={buttonStates["imuOn"]}
                                        text="IMU 1 Status:"
                                    />
                                    <StatusEl
                                        state={buttonStates["imu2On"]}
                                        text="IMU 2 Status:"
                                    />
                                    <StatusEl
                                        state={buttonStates["lidarOn"]}
                                        text="Lidar Status:"
                                    />
                                </div>

                                {/* Initialize and Recording Controls */}
                                <div className="button-container d-flex flex-column align-items-center">
                                    <button
                                        className="btn btn-success mb-3"
                                        onClick={initializeLidar}
                                    >
                                        Initialize Lidar
                                    </button>

                                    <div className="dots d-flex flex-column align-items-center mb-3">
                                        <StatusEl
                                            state={buttonStates["startRec"]}
                                            text="Record Status:"
                                        />
                                        <button
                                            className="btn btn-warning"
                                            onClick={startRecording}
                                            disabled={
                                                !lidarInitialized ||
                                                recordingStarted
                                            }
                                        >
                                            Start Recording
                                        </button>
                                    </div>

                                    <div className="dots d-flex flex-column align-items-center mb-3">
                                        <StatusEl
                                            state={buttonStates["imuOff"]}
                                            text="Stop imu process:"
                                        />
                                        <StatusEl
                                            state={buttonStates["lidarOff"]}
                                            text="Stop Lidar process:"
                                        />
                                        <StatusEl
                                            state={buttonStates["stopRec"]}
                                            text="Stop Recording:"
                                        />
                                    </div>

                                    <button
                                        className="btn btn-danger"
                                        onClick={stopRecording}
                                    >
                                        Stop Recording
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Spacer Column (hide on small screens) */}
                        <div className="d-none d-md-block col-md-2"></div>

                        {/* Right Column */}
                        <div className="col-12 col-md-5 text-white">
                            <div className="d-flex flex-column align-items-center">
                                <h5>DATA IN {dataType}</h5>
                                <div
                                    className="bg-dark p-4 border rounded mb-2"
                                    style={{
                                        width: "100%",
                                        maxWidth: "350px",
                                        height: "300px",
                                        overflowY: "auto",
                                    }}
                                >
                                    {bagsList.length > 0 ? (
                                        bagsList.map((bag, index) => (
                                            <p
                                                key={index}
                                                style={{
                                                    color: "yellow",
                                                    borderBottom:
                                                        "1px solid grey",
                                                }}
                                                className="data-list"
                                            >
                                                {" "}
                                                <span
                                                    style={{
                                                        fontSize: 16,
                                                        color: "white",
                                                    }}
                                                >{`${index + 1}. `}</span>
                                                {bag.split(" ")[0]} <br />{" "}
                                                <span
                                                    style={{
                                                        color: "silver",
                                                        fontSize: "12px",
                                                    }}
                                                >
                                                    Size: {bag.split(" ")[1]}
                                                </span>
                                            </p>
                                        ))
                                    ) : (
                                        <p>EMPTY</p>
                                    )}
                                </div>
                                <button
                                    className="btn btn-success mt-2"
                                    onClick={listLocalRosbags}
                                >
                                    List Local Data
                                </button>
                                <button
                                    className="btn btn-danger mt-2"
                                    onClick={deleteLocalRosbags}
                                >
                                    Delete All Local Data
                                </button>
                            </div>
                            <div class="row justify-content-center align-items-center">
                                <div class="col-10">
                                    <select
                                        className="form-select mt-2"
                                        onChange={handlePdSelect}
                                        value={selectedPd}
                                    >
                                        <option value="">
                                            Select Pendrive
                                        </option>
                                        {pendrives.map((pd) => (
                                            <option value={pd}>{pd}</option>
                                        ))}
                                    </select>
                                </div>
                                <div class="col-2">
                                    <button
                                        class=" btn btn-sm btn-success"
                                        onClick={listPendrives}
                                    >
                                        Refresh
                                    </button>
                                </div>
                            </div>
                            {selectedPd && (
                                <div className="d-flex flex-column align-items-center my-2">
                                    <h5>DATA IN {selectedPd}</h5>
                                    <div
                                        className="bg-dark p-4 border rounded mb-2"
                                        style={{
                                            width: "100%",
                                            maxWidth: "350px",
                                            height: "300px",
                                            overflowY: "auto",
                                        }}
                                    >
                                        {pdBagsList.length > 0 ? (
                                            pdBagsList.map((bag, index) =>
                                                bag
                                                    .toLowerCase()
                                                    .includes("unmount") ? (
                                                    <p>{bag}</p>
                                                ) : (
                                                    <p
                                                        key={index}
                                                        style={{
                                                            color: "yellow",
                                                            borderBottom:
                                                                "1px solid grey",
                                                        }}
                                                        className="data-list"
                                                    >
                                                        {" "}
                                                        <span
                                                            style={{
                                                                fontSize: 16,
                                                                color: "white",
                                                            }}
                                                        >{`${
                                                            index + 1
                                                        }. `}</span>
                                                        {bag.split(" ")[0]}{" "}
                                                        <br />{" "}
                                                        <span
                                                            style={{
                                                                color: "silver",
                                                                fontSize:
                                                                    "12px",
                                                            }}
                                                        >
                                                            Size:{" "}
                                                            {bag.split(" ")[1]}
                                                        </span>{" "}
                                                    </p>
                                                )
                                            )
                                        ) : (
                                            <p>EMPTY</p>
                                        )}
                                    </div>
                                    <button
                                        className="btn btn-success mt-2"
                                        onClick={() =>
                                            listPdRosbags(selectedPd)
                                        }
                                    >
                                        List Pendrive Data
                                    </button>
                                    <button
                                        className="btn btn-warning mt-2"
                                        onClick={copyLocalData}
                                    >
                                        Copy Local Data to Pendrive
                                    </button>
                                    <button
                                        className="btn btn-danger mt-2"
                                        onClick={deletePdRosbags}
                                    >
                                        Delete All Pendrive Data
                                    </button>
                                    <button
                                        className="btn btn-warning mt-2"
                                        onClick={unmountPendrive}
                                    >
                                        Unmount Pendrive
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            ReactDOM.render(<App />, document.getElementById("root"));
        </script>
        <script src="/static/js/popper.min.js"></script>
        <script src="/static/js/bootstrap.min.js"></script>
    </body>
</html>
