            function useStopWatch() {
                const [time, setTime] = useState("00:00:00");

                const intervalRef = useRef(null);
                const startTimeRef = useRef(null);
                const elapsedRef = useRef(0);

                // Format seconds → "hh:mm:ss"
                function format(t) {
                    const hrs = String(Math.floor(t / 3600)).padStart(2, "0");
                    const mins = String(Math.floor((t % 3600) / 60)).padStart(
                        2,
                        "0"
                    );
                    const secs = String(Math.floor(t % 60)).padStart(2, "0");
                    return `${hrs}:${mins}:${secs}`;
                }

                function stopWatch(action) {
                    if (action === "start") {
                        if (!intervalRef.current) {
                            startTimeRef.current =
                                Date.now() - elapsedRef.current * 1000;

                            intervalRef.current = setInterval(() => {
                                const elapsed =
                                    (Date.now() - startTimeRef.current) / 1000;
                                elapsedRef.current = elapsed;
                                setTime(format(elapsed));
                            }, 1000);
                        }
                    }

                    if (action === "stop") {
                        if (intervalRef.current) {
                            clearInterval(intervalRef.current);
                            intervalRef.current = null;

                            const elapsed =
                                (Date.now() - startTimeRef.current) / 1000;
                            elapsedRef.current = elapsed;
                            setTime(format(elapsed));
                        }
                    }

                    if (action === "reset") {
                        clearInterval(intervalRef.current);
                        intervalRef.current = null;
                        elapsedRef.current = 0;
                        startTimeRef.current = null;
                        setTime("00:00:00");
                    }
                }

                return { time, stopWatch };
            }

            function useMediaQuery(query) {
                const [matches, setMatches] = useState(
                    () => window.matchMedia(query).matches
                );

                useEffect(() => {
                    const mediaQueryList = window.matchMedia(query);
                    const listener = (event) => setMatches(event.matches);

                    mediaQueryList.addEventListener("change", listener); // modern API
                    return () =>
                        mediaQueryList.removeEventListener("change", listener);
                }, [query]);

                return matches;
            }

                            className="progress-fill"
                            style={{ width: `${clamped}%` }}
                        />
                        <div className="progress-label">copying... {label}</div>
                    </div>
                );
            }

                                                <div>Direction:</div>
                                                <div>
                                                    <select
                                                        className="form-select-sm"
                                                        style={{
                                                            background: "grey",
                                                        }}
                                                    >
                                                        <option
                                                            value="1"
                                                            selected
                                                        >
                                                            Clockwise
                                                        </option>
                                                        <option value="2">
                                                            Anti-lockwise
                                                        </option>
                                                    </select>
                                                </div>
                                            </div>
                                            <StatusEl
                                                state={buttonStates["motorOn"]}
                                                text="Start Motor:"
                                            />
                                            <StatusEl
                                                state={buttonStates["motorOff"]}
                                                text="Stop Motor:"
                                            />
                                        </div>
                                        <div className="bottom">
                                            <button
                                                className="btn btn-secondary btn-sm w-50"
                                                onClick={() =>
                                                    startMotor(custVel)
                                                }
                                            >
                                                Start Motor {`(v=${custVel})`}
                                            </button>
                                            <button
                                                className="btn btn-danger btn-sm w-50"
                                                onClick={stopMotor}
                                            >
                                                Stop Motor
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="heading">
                                            <h4>Sensor Status</h4>
                                        </div>
                                        <div className="middle">
                                            <StatusEl
                                                state={buttonStates["dataSync"]}
                                                text="Data Syncing:"
                                            />
                                            <StatusEl
                                                state={buttonStates["imuOn"]}
                                                text="IMU 1 Status:"
                                            />
                                            <StatusEl
                                                state={buttonStates["imu2On"]}
                                                text="IMU 2 Status:"
                                            />
                                            <StatusEl
                                                state={buttonStates["lidarOn"]}
                                                text="Lidar Status:"
                                            />
                                        </div>
                                        <div className="bottom">
                                            <button
                                                className="btn btn-secondary btn-sm w-100"
                                                onClick={initializeLidar}
                                            >
                                                Initialize Sensors
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="heading">
                                            <h4>Record</h4>
                                        </div>
                                        <div className="middle">
                                            {false ? (
                                                <StatusEl
                                                    state={
                                                        buttonStates["startRec"]
                                                    }
                                                    text="Record Status:"
                                                />
                                            ) : (
                                                <>
                                                    <StatusEl
                                                        state={
                                                            buttonStates[
                                                                "imuOff"
                                                            ]
                                                        }
                                                        text="Stop imu process:"
                                                    />
                                                    <StatusEl
                                                        state={
                                                            buttonStates[
                                                                "lidarOff"
                                                            ]
                                                        }
                                                        text="Stop Lidar process:"
                                                    />
                                                    <StatusEl
                                                        state={
                                                            buttonStates[
                                                                "stopRec"
                                                            ]
                                                        }
                                                        text="Stop Recording:"
                                                    />
                                                </>
                                            )}
                                            <div>
                                                <div
                                                    className="color-error"
                                                    style={{ fontSize: "28px" }}
                                                >
                                                    &#9679;{" "}
                                                    <span className="color-white">
                                                        {time}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bottom">
                                            <button
                                                onClick={startRecording}
                                                className="btn btn-secondary btn-sm w-50"
                                            >
                                                Start Recording
                                            </button>
                                            <button
                                                className="btn btn-danger btn-sm w-50"
                                                onClick={stopRecording}
                                            >
                                                Stop Recording/Sensors
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div className="container-lower">
                                    <div>
                                        <div className="heading">
                                            <h4>Data in Device</h4>
                                            <div
                                                style={{
                                                    display: "flex",
                                                    gap: "10px",
                                                    marginBottom: "10px",
                                                    justifyContent: "flex-end",
                                                }}
                                            >
                                                <button
                                                    className="btn btn-secondary btn-sm"
                                                    onClick={copyLocalData}
                                                >
                                                    Transfer Data
                                                </button>
                                            </div>
                                        </div>
                                        <div className="middle middle-low">
                                            <div>
                                                {bagsList.length > 0 ? (
                                                    bagsList.map(
                                                        (bag, index) => (
                                                            <p
                                                                key={index}
                                                                style={{
                                                                    color: "yellow",
                                                                    borderBottom:
                                                                        "1px solid grey",
                                                                }}
                                                                className="data-list"
                                                            >
                                                                {" "}
                                                                <span
                                                                    style={{
                                                                        fontSize: 16,
                                                                        color: "white",
                                                                    }}
                                                                >{`${
                                                                    index + 1
                                                                }. `}</span>
                                                                {
                                                                    bag.split(
                                                                        " "
                                                                    )[0]
                                                                }{" "}
                                                                <br />{" "}
                                                                <span
                                                                    style={{
                                                                        color: "silver",
                                                                        fontSize:
                                                                            "12px",
                                                                    }}
                                                                >
                                                                    Size:{" "}
                                                                    {
                                                                        bag.split(
                                                                            " "
                                                                        )[1]
                                                                    }
                                                                </span>
                                                            </p>
                                                        )
                                                    )
                                                ) : (
                                                    <p>EMPTY</p>
                                                )}
                                            </div>
                                        </div>
                                        <div className="bottom">
                                            <button
                                                onClick={listLocalRosbags}
                                                className="btn btn-secondary btn-sm w-50"
                                            >
                                                Refresh
                                            </button>
                                            <button
                                                onClick={deleteLocalRosbags}
                                                className="btn btn-secondary btn-danger btn-sm w-50"
                                            >
                                                Delete All
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="heading">
                                            {selectedPd && (
                                                <h4>Data in External Drive</h4>
                                            )}
                                            <div
                                                style={{
                                                    display: "flex",
                                                    gap: "10px",
                                                    marginBottom: "10px",
                                                    justifyContent: "flex-end",
                                                }}
                                            >
                                                {selectedPd && (
                                                    <div className="datapath">
                                                        Data Path: /{selectedPd}
                                                        /rosbags
                                                    </div>
                                                )}
                                                <select
                                                    className="form-select-sm"
                                                    style={
                                                        selectedPd
                                                            ? {
                                                                  background:
                                                                      "grey",
                                                              }
                                                            : {
                                                                  background:
                                                                      "grey",
                                                              }
                                                    }
                                                    onChange={handlePdSelect}
                                                    value={selectedPd}
                                                >
                                                    <option value="">
                                                        Select Drive
                                                    </option>
                                                    {pendrives.map((pd) => (
                                                        <option value={pd}>
                                                            {pd}
                                                        </option>
                                                    ))}
                                                </select>
                                                <button
                                                    className="btn btn-secondary btn-sm"
                                                    onClick={listPendrives}
                                                >
                                                    Refresh
                                                </button>
                                                {selectedPd && (
                                                    <button
                                                        className="btn btn-secondary btn-warning btn-sm"
                                                        onClick={() =>
                                                            unmountPendrive()
                                                        }
                                                    >
                                                        Unmount
                                                    </button>
                                                )}
                                            </div>
                                        </div>

                                        <div className="middle middle-low">
                                            {selectedPd ? (
                                                <div>
                                                    {pdBagsList.length > 0 ? (
                                                        pdBagsList.map(
                                                            (bag, index) =>
                                                                bag
                                                                    .toLowerCase()
                                                                    .includes(
                                                                        "unmount"
                                                                    ) ? (
                                                                    <p>{bag}</p>
                                                                ) : (
                                                                    <p
                                                                        key={
                                                                            index
                                                                        }
                                                                        style={{
                                                                            color: "yellow",
                                                                            borderBottom:
                                                                                "1px solid grey",
                                                                        }}
                                                                        className="data-list"
                                                                    >
                                                                        {" "}
                                                                        <span
                                                                            style={{
                                                                                fontSize: 16,
                                                                                color: "white",
                                                                            }}
                                                                        >{`${
                                                                            index +
                                                                            1
                                                                        }. `}</span>
                                                                        {
                                                                            bag.split(
                                                                                " "
                                                                            )[0]
                                                                        }{" "}
                                                                        <br />{" "}
                                                                        <span
                                                                            style={{
                                                                                color: "silver",
                                                                                fontSize:
                                                                                    "12px",
                                                                            }}
                                                                        >
                                                                            Size:{" "}
                                                                            {
                                                                                bag.split(
                                                                                    " "
                                                                                )[1]
                                                                            }
                                                                        </span>{" "}
                                                                    </p>
                                                                )
                                                        )
                                                    ) : (
                                                        <p>EMPTY</p>
                                                    )}
                                                </div>
                                            ) : (
                                                <div
                                                    style={{
                                                        textAlign: "center",
                                                    }}
                                                >
                                                    Select a Drive
                                                </div>
                                            )}
                                        </div>
                                        {selectedPd && (
                                            <div className="bottom">
                                                <button
                                                    className="btn btn-secondary btn-sm w-50"
                                                    onClick={() =>
                                                        listPdRosbags(
                                                            selectedPd
                                                        )
                                                    }
                                                >
                                                    Refresh
                                                </button>
                                                <button className="btn btn-secondary btn-danger btn-sm w-50">
                                                    Delete All
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            ReactDOM.render(<App />, document.getElementById("root"));
        </script>
        <script src="/static/js/popper.min.js"></script>
        <script src="/static/js/bootstrap.min.js"></script>
    </body>
</html>
