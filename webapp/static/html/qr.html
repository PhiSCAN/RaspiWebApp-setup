    <!-- Your React code -->
    <script type="text/babel">
        var globModalOpen = false
        const { useState, useEffect } = React;


        function useMediaQuery(query) {
            const [matches, setMatches] = useState(
                () => window.matchMedia(query).matches
            );

            useEffect(() => {
                const mediaQueryList = window.matchMedia(query);
                const listener = (event) => setMatches(event.matches);

                mediaQueryList.addEventListener("change", listener); // modern API
                return () =>
                    mediaQueryList.removeEventListener("change", listener);
            }, [query]);

            return matches;
        }

        function App() {
            const isMobile = useMediaQuery("(max-width: 768px)");


            function generateQRCode(text) {

                let qrContainer = document.getElementById("qrcode");
                qrContainer.innerHTML = ""; // Clear previous QR
                const modalBody = document.getElementById('modal-body');
                const width = modalBody.offsetWidth;
                const height = modalBody.offsetHeight;
                const size = Math.min(width, height) * 0.9; // Keep it square

                new QRCode(qrContainer, {
                    text: text,
                    width: size,
                    height: size,
                });
                console.log("qring");

            }

            const socket = new WebSocket("ws://10.42.0.1:8765");
            // const socket = new WebSocket("ws://127.0.0.1:8765");
            socket.onmessage = function (event) {
                generateQRCode(event.data)
            }


            return (
                <div
                    className="row text-center"
                    style={{
                        width: isMobile ? "auto" : "50rem",
                        marginTop: "20px",
                    }}
                >
                    <h1 style={{ color: "white" }}>CAMERA QR</h1>
                    <div className="modal-body" id="modal-body" style={{ height: "100vh", width: "100vw" }}>
                        <div id="qrcode"></div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById("root"));
    </script>
    <script src="/static/js/popper.min.js"></script>
